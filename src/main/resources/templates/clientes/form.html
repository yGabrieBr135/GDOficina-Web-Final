<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><aside th:replace="~{layout :: menu}"></aside><main><header th:replace="~{layout :: header}"></header><div th:replace="~{layout :: avisos}"></div><div class="title"><div><h1 th:text="(${id} == null ? 'Cadastrar ' : 'Editar ') + 'cliente'"></h1><p class="sub">Campos com * são obrigatórios.</p></div><a class="button ghost" th:href="@{/clientes}">Voltar</a></div><section class="panel"><form method="post" th:action="${id == null} ? @{/clientes} : @{/clientes/{id}(id=${id})}" th:object="${form}"><div class="alert error" th:if="${#fields.hasAnyErrors()}" role="alert"><strong>Confira os campos informados.</strong><p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div><div class="grid"><label>Nome *<input type="text" th:field="*{nome}" required maxlength="100"><small class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small></label><label>Telefone *<input type="text" th:field="*{telefone}" required maxlength="25"><small class="field-error" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></small></label><label>E-mail<input type="email" th:field="*{email}" maxlength="254"><small class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small></label></div><div class="dialogfoot"><a class="button ghost" th:href="@{/clientes}">Cancelar</a><button type="submit">Salvar</button></div></form></section><p class="notice">© GD Oficina • Gestão de oficinas mecânicas</p></main></body></html>
