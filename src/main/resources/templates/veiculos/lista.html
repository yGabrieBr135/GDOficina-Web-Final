<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><aside th:replace="~{layout :: menu}"></aside><main><header th:replace="~{layout :: header}"></header><div th:replace="~{layout :: avisos}"></div><div class="title"><div><h1>Veículos</h1><p class="sub">Consulte e organize os registros da oficina.</p></div><a class="button" th:href="@{/veiculos/novo}">+ Novo cadastro</a></div><section class="panel"><form class="toolbar" method="get" th:action="@{/veiculos}"><input name="q" th:value="${q}" aria-label="Pesquisar" placeholder="Pesquisar nesta listagem…"><button type="submit">Pesquisar</button><a class="button ghost" th:href="@{/veiculos}">Limpar</a></form><div class="tablewrap"><table><thead><tr><th>Placa</th><th>Marca</th><th>Modelo</th><th>Ano</th><th>Cliente</th><th>Ações</th></tr></thead><tbody><tr th:each="x : ${registros}"><td th:text="${x.placa}"></td><td th:text="${x.marca}"></td><td th:text="${x.modelo}"></td><td th:text="${x.ano}"></td><td th:text="${x.cliente.nome}"></td><td><a class="button link" th:href="@{/veiculos/{id}/editar(id=${x.id})}">Editar</a> <a class="button link remove" th:href="@{/veiculos/{id}/excluir(id=${x.id})}">Excluir</a></td></tr><tr th:if="${#lists.isEmpty(registros)}"><td colspan="6" class="empty">Nenhum registro encontrado.</td></tr></tbody></table></div></section><p class="notice">© GD Oficina • Gestão de oficinas mecânicas</p></main></body></html>
