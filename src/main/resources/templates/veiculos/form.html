<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><aside th:replace="~{layout :: menu}"></aside><main><header th:replace="~{layout :: header}"></header><div th:replace="~{layout :: avisos}"></div><div class="title"><div><h1 th:text="(${id} == null ? 'Cadastrar ' : 'Editar ') + 'veículo'"></h1><p class="sub">Campos com * são obrigatórios.</p></div><a class="button ghost" th:href="@{/veiculos}">Voltar</a></div><section class="panel"><form method="post" th:action="${id == null} ? @{/veiculos} : @{/veiculos/{id}(id=${id})}" th:object="${form}"><div class="alert error" th:if="${#fields.hasAnyErrors()}" role="alert"><strong>Confira os campos informados.</strong><p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div><div class="grid"><label>Cliente *<select th:field="*{clienteId}" required><option value="">Selecione</option><option th:each="x : ${clientes}" th:value="${x.id}" th:text="${x.nome}"></option></select><small class="field-error" th:errors="*{clienteId}"></small></label><label>Placa *<input type="text" th:field="*{placa}" required maxlength="7" placeholder="ABC1D23" pattern="[A-Za-z]{3}[0-9][A-Za-z0-9][0-9]{2}"><small class="field-error" th:if="${#fields.hasErrors('placa')}" th:errors="*{placa}"></small></label><label>Marca *<input type="text" th:field="*{marca}" required maxlength="100"><small class="field-error" th:if="${#fields.hasErrors('marca')}" th:errors="*{marca}"></small></label><label>Modelo *<input type="text" th:field="*{modelo}" required maxlength="100"><small class="field-error" th:if="${#fields.hasErrors('modelo')}" th:errors="*{modelo}"></small></label><label>Ano *<input type="number" th:field="*{ano}" min="1900" max="2100" required><small class="field-error" th:if="${#fields.hasErrors('ano')}" th:errors="*{ano}"></small></label></div><div class="dialogfoot"><a class="button ghost" th:href="@{/veiculos}">Cancelar</a><button type="submit">Salvar</button></div></form></section><p class="notice">© GD Oficina • Gestão de oficinas mecânicas</p></main></body></html>
