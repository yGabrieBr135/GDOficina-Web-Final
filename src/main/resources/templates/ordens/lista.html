<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><aside th:replace="~{layout :: menu}"></aside><main><header th:replace="~{layout :: header}"></header><div th:replace="~{layout :: avisos}"></div><div class="title"><div><h1>Ordens de serviço</h1><p class="sub">Consulte e organize os registros da oficina.</p></div><a class="button" th:href="@{/ordens/novo}">+ Novo cadastro</a></div><section class="panel"><form class="toolbar" method="get" th:action="@{/ordens}"><input name="q" th:value="${q}" aria-label="Pesquisar" placeholder="Pesquisar nesta listagem…"><button type="submit">Pesquisar</button><a class="button ghost" th:href="@{/ordens}">Limpar</a></form><div class="tablewrap"><table><thead><tr><th>Ordem</th><th>Veículo</th><th>Cliente</th><th>Abertura</th><th>Situação</th><th>Total</th><th>Ações</th></tr></thead><tbody><tr th:each="x : ${registros}"><td th:text="${x.id}"></td><td th:text="${x.veiculo.placa + ' · ' + x.veiculo.modelo}"></td><td th:text="${x.veiculo.cliente.nome}"></td><td th:text="${#temporals.format(x.dataAbertura, 'dd/MM/yyyy')}"></td><td th:text="${x.status.descricao}"></td><td th:text="${@fmt.moeda(x.total)}"></td><td><a class="button link" th:href="@{/ordens/{id}/editar(id=${x.id})}">Editar</a> <a class="button link remove" th:href="@{/ordens/{id}/excluir(id=${x.id})}">Excluir</a></td></tr><tr th:if="${#lists.isEmpty(registros)}"><td colspan="7" class="empty">Nenhum registro encontrado.</td></tr></tbody></table></div></section><p class="notice">© GD Oficina • Gestão de oficinas mecânicas</p></main></body></html>
