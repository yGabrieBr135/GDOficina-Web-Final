<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><aside th:replace="~{layout :: menu}"></aside><main><header th:replace="~{layout :: header}"></header><div th:replace="~{layout :: avisos}"></div><div class="title"><div><h1 th:text="(${id} == null ? 'Cadastrar ' : 'Editar ') + 'ordem de serviço'"></h1><p class="sub">Campos com * são obrigatórios.</p></div><a class="button ghost" th:href="@{/ordens}">Voltar</a></div><section class="panel"><form method="post" th:action="${id == null} ? @{/ordens} : @{/ordens/{id}(id=${id})}" th:object="${form}"><div class="alert error" th:if="${#fields.hasAnyErrors()}" role="alert"><strong>Confira os campos informados.</strong><p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div><div class="grid"><label>Veículo *<select th:field="*{veiculoId}" required><option value="">Selecione</option><option th:each="x : ${veiculos}" th:value="${x.id}" th:text="${x.placa + ' · ' + x.modelo + ' / ' + x.cliente.nome}"></option></select><small class="field-error" th:errors="*{veiculoId}"></small></label><label>Data de abertura *<input type="date" th:field="*{dataAbertura}" required><small class="field-error" th:if="${#fields.hasErrors('dataAbertura')}" th:errors="*{dataAbertura}"></small></label><label>Situação *<select th:field="*{status}" required><option th:each="s : ${situacoes}" th:value="${s}" th:text="${s.descricao}"></option></select><small class="field-error" th:errors="*{status}"></small></label><label class="wide">Observações<textarea th:field="*{observacoes}" maxlength="2000" rows="3"></textarea><small class="field-error" th:errors="*{observacoes}"></small></label></div><section class="items"><h2>Serviços da ordem</h2><p class="sub">O valor unitário é registrado na ordem. Alterar o catálogo não altera ordens anteriores.</p><div class="itemadd"><select id="serviceChoice" aria-label="Serviço para adicionar"><option value="">Selecione um serviço</option><option th:each="s : ${servicos}" th:value="${s.id}" th:attr="data-price=${s.preco}" th:text="${s.nome + ' — ' + @fmt.moeda(s.preco)}"></option></select><button type="button" id="addItem">Adicionar</button></div><p id="itemMessage" role="status"></p><small class="field-error" th:errors="*{itens}"></small><div class="tablewrap"><table><thead><tr><th>Serviço</th><th>Quantidade</th><th>Unitário (R$)</th><th>Subtotal</th><th>Ação</th></tr></thead><tbody id="itemRows"><tr th:each="item, iter : *{itens}"><td><select class="service" th:field="*{itens[__${iter.index}__].servicoId}" required><option value="">Selecione</option><option th:each="s : ${servicos}" th:value="${s.id}" th:text="${s.nome}"></option></select><small class="field-error" th:errors="*{itens[__${iter.index}__].servicoId}"></small></td><td><input aria-label="Quantidade" class="quantity" type="number" min="1" max="9999" step="1" th:field="*{itens[__${iter.index}__].quantidade}" required><small class="field-error" th:errors="*{itens[__${iter.index}__].quantidade}"></small></td><td><input aria-label="Valor unitário" class="price" type="number" min="0" max="9999999999.99" step="0.01" th:field="*{itens[__${iter.index}__].valorUnitario}" required><small class="field-error" th:errors="*{itens[__${iter.index}__].valorUnitario}"></small></td><td class="subtotal"></td><td><button type="button" class="link remove removeItem">Remover</button></td></tr></tbody></table></div><p class="total">Total <span id="orderTotal">R$ 0,00</span></p><noscript>Ative JavaScript para adicionar ou remover itens da ordem.</noscript></section><div class="dialogfoot"><a class="button ghost" th:href="@{/ordens}">Cancelar</a><button type="submit">Salvar</button></div></form></section><p class="notice">© GD Oficina • Gestão de oficinas mecânicas</p></main><script th:src="@{/js/ordem.js}" defer></script></body></html>
